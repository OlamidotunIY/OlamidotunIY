<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="winBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window body -->
  <rect x="1" y="1" width="898" height="598" rx="14" fill="#0d1117" stroke="url(#winBorder)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="898" height="40" rx="14" fill="#161b22"/>
  <rect x="1" y="27" width="898" height="14" fill="#161b22"/>

  <circle cx="30" cy="21" r="6.5" fill="#ff5f56"/>
  <circle cx="52" cy="21" r="6.5" fill="#ffbd2e"/>
  <circle cx="74" cy="21" r="6.5" fill="#27c93f"/>

  <text x="450" y="26" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8b949e">dotun@backend — zsh</text>

  <!-- Body text -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">

    <text x="40" y="72" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> sudo systemctl start dotun.service</text>

    <text x="40" y="120" fill="#8b949e">Initializing Runtime<tspan fill="#30363d">.......................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="144" fill="#8b949e">Loading TypeScript<tspan fill="#30363d">.........................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="168" fill="#8b949e">Loading Java<tspan fill="#30363d">...............................</tspan> <tspan fill="#3fb950">✓</tspan></text>

    <text x="40" y="216" fill="#8b949e">Starting NestJS<tspan fill="#30363d">............................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="240" fill="#8b949e">Loading Domain Layer<tspan fill="#30363d">.......................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="264" fill="#8b949e">Registering Aggregates<tspan fill="#30363d">.....................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="288" fill="#8b949e">Building Dependency Graph<tspan fill="#30363d">.................</tspan> <tspan fill="#3fb950">✓</tspan></text>

    <text x="40" y="336" fill="#8b949e">Connecting PostgreSQL<tspan fill="#30363d">.....................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="360" fill="#8b949e">Connecting Redis<tspan fill="#30363d">..........................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="384" fill="#8b949e">Registering Event Bus<tspan fill="#30363d">.....................</tspan> <tspan fill="#3fb950">✓</tspan></text>
    <text x="40" y="408" fill="#8b949e">Starting Background Workers<tspan fill="#30363d">...............</tspan> <tspan fill="#3fb950">✓</tspan></text>

    <line x1="40" y1="432" x2="860" y2="432" stroke="#21262d" stroke-width="1"/>

    <text x="40" y="470" fill="#8b949e">Status</text>
    <text x="220" y="470" fill="#3fb950" font-weight="bold" filter="url(#glow)">ONLINE</text>

    <text x="40" y="494" fill="#8b949e">Role</text>
    <text x="220" y="494" fill="#58a6ff">Backend Engineer</text>

    <text x="40" y="518" fill="#8b949e">Architecture</text>
    <text x="220" y="518" fill="#58a6ff">DDD • EIP • Event Driven</text>

    <text x="40" y="542" fill="#8b949e">Mission</text>
    <text x="220" y="542" fill="#e6edf3">Build systems that survive scale.</text>

    <text x="40" y="566" fill="#8b949e">Current Focus</text>
    <text x="220" y="566" fill="#e6edf3">Payment Infrastructure &amp; Distributed Systems</text>

  </g>

  <!-- Blinking cursor -->
  <rect x="41" y="580" width="9" height="14" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>
