<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <!-- Brand Gradient: matches the blue palette used across the rest of the README -->
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#3b82f6;#0ea5e9;#2563eb" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#0ea5e9;#2563eb;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#2563eb;#3b82f6;#0ea5e9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Text Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Accent Line Top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#premiumGradient)"/>

  <!-- Main Name Text -->
  <g filter="url(#textShadow)">
    <text x="450" y="75" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="700" fill="url(#premiumGradient)" letter-spacing="3">
      DOTUN IYANDA
    </text>
  </g>

  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="16" fill="#9ca3af" letter-spacing="3">
    BACKEND ENGINEER  •  DISTRIBUTED SYSTEMS  •  FINTECH INFRASTRUCTURE
  </text>

  <!-- Decorative Elements -->
  <g opacity="0.6">
    <line x1="90" y1="140" x2="380" y2="140" stroke="url(#premiumGradient)" stroke-width="1">
      <animate attributeName="x2" values="90;380" dur="1s" fill="freeze"/>
    </line>
    <line x1="520" y1="140" x2="810" y2="140" stroke="url(#premiumGradient)" stroke-width="1">
      <animate attributeName="x1" values="810;520" dur="1s" fill="freeze"/>
    </line>
  </g>

  <!-- Center Diamond -->
  <polygon points="450,135 458,145 450,155 442,145" fill="url(#premiumGradient)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 450 145" to="360 450 145" dur="10s" repeatCount="indefinite"/>
  </polygon>

  <!-- Accent Line Bottom -->
  <rect x="0" y="177" width="900" height="3" fill="url(#premiumGradient)"/>
</svg>